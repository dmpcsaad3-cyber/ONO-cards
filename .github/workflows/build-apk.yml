name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as a GitHub Release (direct APK download link)'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Assemble Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses & Ensure SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" || true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Sync Web App to Android
        run: |
          # Purge any committed or stale Gradle locks and cache files
          rm -rf android/.gradle android/build android/app/build

          # Configure Android SDK path if ANDROID_HOME is set
          if [ -n "$ANDROID_HOME" ]; then
            mkdir -p android
            echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          fi

          # Ensure gradlew has executable permissions if present
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

          # Initialize Android platform if not present
          if [ ! -d "android/app" ]; then
            echo "Adding Android platform..."
            ./node_modules/.bin/cap add android
          fi

          # Sync web assets and plugins to Android native project
          echo "Syncing web assets and plugins to Android..."
          ./node_modules/.bin/cap sync android

          # Ensure gradlew is executable and local.properties is configured
          chmod +x android/gradlew
          if [ -n "$ANDROID_HOME" ]; then
            echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          fi

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Easy Distribution
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/ONO-Card-Game-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ono-game-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/ONO-Card-Game-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK
        if: ${{ github.event.inputs.create_release == 'true' || startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'v1.0.0' }}
          name: ONO Card Game APK (${{ github.event.inputs.release_tag || 'v1.0.0' }})
          body: |
            ## ONO Card Game Android APK Release
            Download and install the APK directly on your Android device.
            - **File**: `ONO-Card-Game-debug.apk`
            - **Package Name**: `com.onocardgame.app`
          files: |
            android/app/build/outputs/apk/debug/ONO-Card-Game-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
