<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Fan of cards in background -->
  <g transform="translate(256,260)">
    <!-- Blue card -->
    <rect x="-90" y="-140" width="180" height="260" rx="20" fill="url(#blueGrad)" stroke="#ffffff" stroke-width="6" transform="rotate(-20)" filter="url(#shadow)"/>
    <!-- Green card -->
    <rect x="-90" y="-140" width="180" height="260" rx="20" fill="url(#greenGrad)" stroke="#ffffff" stroke-width="6" transform="rotate(-7)" filter="url(#shadow)"/>
    <!-- Yellow card -->
    <rect x="-90" y="-140" width="180" height="260" rx="20" fill="url(#yellowGrad)" stroke="#ffffff" stroke-width="6" transform="rotate(8)" filter="url(#shadow)"/>
    <!-- Front Red Card -->
    <g transform="rotate(22)" filter="url(#shadow)">
      <rect x="-90" y="-140" width="180" height="260" rx="20" fill="url(#redGrad)" stroke="#ffffff" stroke-width="6"/>
      <!-- Oval -->
      <ellipse cx="0" cy="0" rx="72" ry="105" fill="#ffffff" transform="rotate(-25)"/>
      <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#dc2626" text-anchor="middle" font-style="italic">ONO</text>
    </g>
  </g>
</svg>
